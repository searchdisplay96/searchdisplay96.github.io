<!DOCTYPE html>
<html>
<head>
   <meta charset="UTF-8">
    
<meta name="viewport" content="width=device-width, initial-scale=1.0">
   <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
 
<title>Search and Display</title>
<style>
body{
background-color: #d8d99b;
   text-align: center;
}
#searchText{

    height: 30px;
    border-radius: 16px;
	width:100%;
}
.btn{
  height: 30px;
    border-radius: 16px;
	width:30%;
	
}
#search{
    background-color: #aab762;
}
.outer{
margin: 10px 0;
    padding: 10px 0;
    border: 1px solid #9ea539;
    border-radius: 10px;
}
.title{
font-weight:700;
padding-bottom: 10px;
}
h1{
 
    color: #3a435e;
}
.show{
display:block;
}
.hide{
display:none;
}
.select-inner{
padding: 1rem 0.4rem;
    border: 0.1rem solid grey;
    border-top: none;
}
</style>
</head>
<body>

<h1>Agilus Tests</h1>
<hr>
<div class="input-section">
<input type="text" id="searchText" placeholder="Please enter test code" >
<div class='select-box' id='selectData'></div>
<br><br>
<div class='btns'>
<input type="button" class="btn" id="reset" value="Reset">
</div>
<div class="result-section hide">
<div class="outer">
<div class="title">TEST CODE </div>
<div class="valueCode" id="valueCode"> </div>
</div>

<div class="outer">
<div class="title">TEST NAME </div>
<div class="valueCode" id="valueName"> </div>
</div>

<div class="outer">
<div class="title"> MRP </div>
<div class="valueCode" id="valueMRP"> </div>
</div>

<div class="outer">
<div class="title">DISCOUNT CATEGORY </div>
<div class="valueCode" id="valueDisc"> </div>
</div>


<div class="outer">
<div class="title">METHOD </div>
<div class="valueCode" id="valueMethod"> </div>
</div>

<div class="outer">
<div class="title">SPEC, SPEC VOL, SPEC STABILITY </div>
<div class="valueCode" id="valueSpecs"> </div>
</div>


<div class="outer">
<div class="title">CONSTITUENTS </div>
<div class="valueCode" id="valueConst"> </div>
</div>

<div class="outer">
<div class="title">PERFORMING LOCATION </div>
<div class="valueCode" id="valuePerform"> </div>
</div>


<div class="outer">
<div class="title">MUMBAI REPORTED</div>
<div class="valueCode" id="valueMumR"> </div>
</div>

<div class="outer">
<div class="title">MUMBAI FREQUNECY </div>
<div class="valueCode" id="valueMumF"> </div>
</div>

<div class="outer">
<div class="title">GURGAON REPORTED </div>
<div class="valueCode" id="valueGurR"> </div>
</div>

<div class="outer">
<div class="title">GURGAON FREQUENCY </div>
<div class="valueCode" id="valueGurF"> </div>
</div>



</div>

<script>
var jsonData
// Create an async function to use 'await'
async function fetchAndParseExcel() {
  try {
    // Fetch the Excel file
    const response = await fetch('https://searchdisplay96.github.io/exceldata1.xlsx');
    if (!response.ok) {
      throw new Error('Failed to fetch Excel file');
    }

    // Get the ArrayBuffer from the response
    const arrayBuffer = await response.arrayBuffer();

    // Parse the ArrayBuffer using XLSX
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });

    // Get the name of the first sheet
    const sheetName = workbook.SheetNames[0];

    // Get the first sheet
    const sheet = workbook.Sheets[sheetName];

    // Convert the sheet to JSON
    jsonData = XLSX.utils.sheet_to_json(sheet);


  } catch (error) {
    console.error('Error:', error);
  }
}

// Call the async function
fetchAndParseExcel();
                
 



document.getElementById('reset').addEventListener('click', function(event) {
document.getElementById('searchText').value='';
document.getElementsByClassName("result-section")[0].classList.remove("show");
document.getElementsByClassName("result-section")[0].classList.add("hide");
document.getElementById('selectData').innerHTML = '';
});

document.getElementById('searchText').addEventListener('keyup', async function(event) {
if(event.target.value.length ){
const results = jsonData.filter(item =>{ 
return String(item.TESTCODE).toLowerCase().includes(event.target.value.toLowerCase()) || 
       String(item.TESTNAME).toLowerCase().includes(event.target.value.toLowerCase());


}); // Customize based on your data structure

if(results.length > 0){
let selectDatas='';
results.forEach((selects)=>{
selectDatas +='<div onclick="showInfo(event)" data-testcode="'+selects.TESTCODE+'" class="select-inner"><span class="code">'+selects.TESTCODE+'</span> | <span class="name">'+selects.TESTNAME+'</span></div>';

})

document.getElementById('selectData').innerHTML=selectDatas;

}else{
document.getElementById('selectData').innerHTML = '';
}
}

if(event.target.value==0 ){
document.getElementById('selectData').innerHTML = '';
}
});

function showInfo(e){

            const results = jsonData.filter(item =>{ 

return String(item.TESTCODE).toLowerCase() == String(e.currentTarget.dataset.testcode).toLowerCase()


}

); // Customize based on your data structure

if(results.length > 0){
document.getElementById('selectData').innerHTML = '';
displayResults(results[0]);
}
  
}
function displayResults(results) {
document.getElementsByClassName("result-section")[0].classList.add("show");
document.getElementsByClassName("result-section")[0].classList.remove("hide");

 document.getElementById('valueCode').innerHTML=results.TESTCODE;
 document.getElementById('valueName').innerHTML=results.TESTNAME;
 document.getElementById('valueMRP').innerHTML=results.MRP;
 document.getElementById('valueSpecs').innerHTML=results.SPECSTABILITY;
 document.getElementById('valuePerform').text=results.PERFORMINGLOCATION ;
 document.getElementById('valueMethod').innerHTML=results.METHOD;
 document.getElementById('valueDisc').innerHTML=results.DISCOUNTCATEGORY;
 document.getElementById('valueConst').innerHTML=results.CONSTITUENTS;
 
  document.getElementById('valueMumR').text=results.MUMBAIREPORTED;
 document.getElementById('valueMumF').innerHTML=results.MUMBAIFREQUNECY;
  document.getElementById('valueGurR').innerHTML=results.GURGAONREPORTED;
 document.getElementById('valueGurF').innerHTML=results.GURGAONFREQUENCY;
 
}

</script>
</body>
</html>
